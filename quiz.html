<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0a1628" />
  <title>Quiz – EnglishIn28</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar" id="quizTopbar">
    <button class="topbar-back" id="topbarBack" onclick="handleBack()">←</button>
    <div class="topbar-logo" id="topbarTitle">Quiz</div>
    <div class="topbar-right" id="topbarRight">
      <span class="topbar-badge">Pick a day</span>
    </div>
  </header>

  <main class="quiz-main">

    <!-- ===== SELECTOR SCREEN ===== -->
    <div id="screenSelector">
      <div class="quiz-selector-header">
        <div class="section-eyebrow">Choose a Day</div>
        <p class="qs-sub">Complete the lesson first to unlock its quiz</p>
      </div>

      <!-- Week filter chips -->
      <div class="filter-chips">
        <button class="chip active" data-week="all">All</button>
        <button class="chip" data-week="1">Week 1</button>
        <button class="chip" data-week="2">Week 2</button>
        <button class="chip" data-week="3">Week 3</button>
        <button class="chip" data-week="4">Week 4 ✨</button>
      </div>

      <div class="quiz-cards-list" id="quizCardsList">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- ===== ACTIVE QUIZ SCREEN ===== -->
    <div id="screenQuiz" style="display:none">
      <!-- Progress header -->
      <div class="qz-progress-header">
        <div class="qph-bar-wrap">
          <div class="qph-bar" id="qphBar" style="width:0%"></div>
        </div>
        <div class="qph-info">
          <span id="qphLabel">Day 1 Quiz</span>
          <span id="qphCount">1 / 3</span>
        </div>
      </div>

      <!-- Question card -->
      <div class="question-card" id="questionCard">
        <div class="qc-num" id="qcNum">Q1</div>
        <div class="qc-text" id="qcText">Loading...</div>
      </div>

      <!-- Options -->
      <div class="options-list" id="optionsList">
        <!-- populated by JS -->
      </div>

      <!-- Feedback -->
      <div class="quiz-feedback" id="quizFeedback" style="display:none"></div>

      <!-- Next button -->
      <div class="quiz-next-wrap">
        <button class="btn-primary full" id="nextBtn" onclick="nextQuestion()" style="display:none">
          Next Question →
        </button>
      </div>
    </div>

    <!-- ===== RESULT SCREEN ===== -->
    <div id="screenResult" style="display:none">
      <div class="result-screen">
        <div class="rs-emoji" id="rsEmoji">🎉</div>
        <div class="rs-title" id="rsTitle">Well done!</div>
        <div class="rs-score-ring">
          <div class="rsr-score" id="rsScore">0/3</div>
          <div class="rsr-pct" id="rsPct">0%</div>
        </div>
        <div class="rs-msg" id="rsMsg">Keep going!</div>

        <!-- Answer review -->
        <div class="rs-review" id="rsReview"></div>

        <div class="rs-actions">
          <button class="btn-primary full" onclick="retryQuiz()">Try Again</button>
          <button class="btn-outline full" onclick="backToSelector()">Back to Quizzes</button>
          <button class="btn-outline full" onclick="window.location.href='lessons.html'">View Lessons</button>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bn-item">
      <span class="bn-icon">🏠</span><span class="bn-label">Home</span>
    </a>
    <a href="lessons.html" class="bn-item">
      <span class="bn-icon">📚</span><span class="bn-label">Lessons</span>
    </a>
    <a href="quiz.html" class="bn-item active">
      <span class="bn-icon">✏️</span><span class="bn-label">Quiz</span>
    </a>
    <a href="progress.html" class="bn-item">
      <span class="bn-icon">📊</span><span class="bn-label">Progress</span>
    </a>
  </nav>

  <script src="script.js"></script>
  <script>
    let currentDay = null, qIndex = 0, questions = [], userAnswers = [], score = 0;

    document.addEventListener('DOMContentLoaded', () => {
      renderQuizCards('all');
      setupChips();
      const params = new URLSearchParams(window.location.search);
      const day = parseInt(params.get('day'));
      if (day) startQuiz(day);
    });

    function setupChips() {
      document.querySelectorAll('.chip').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
          renderQuizCards(c.dataset.week);
        });
      });
    }

    function renderQuizCards(filter) {
      const completed = getCompleted();
      const scores = JSON.parse(localStorage.getItem('quizScores') || '{}');
      const list = document.getElementById('quizCardsList');
      list.innerHTML = '';

      let days = Array.from({ length: Object.keys(LESSONS).length }, (_, i) => i + 1);
      if (filter !== 'all') days = days.filter(d => Math.ceil(d / 7) === parseInt(filter));

      days.forEach(day => {
        const lesson = LESSONS[day];
        const isUnlocked = completed.includes(day) || day === 1;
        const saved = scores[day];

        const card = document.createElement('div');
        card.className = `qcard ${isUnlocked ? '' : 'qcard-locked'} ${saved ? 'qcard-done' : ''}`;
        card.innerHTML = `
          <div class="qcard-left">
            <div class="qcard-circle ${isUnlocked ? (saved ? 'qcc-done' : 'qcc-open') : 'qcc-locked'}">
              ${isUnlocked ? (saved ? '✓' : day) : '🔒'}
            </div>
          </div>
          <div class="qcard-center">
            <div class="qcard-day">Day ${day}</div>
            <div class="qcard-title">${lesson.title}</div>
            ${saved ? `<div class="qcard-score">Best: ${saved.score}/${saved.total} · ${saved.pct}%</div>` : `<div class="qcard-meta">3 questions · ${lesson.type}</div>`}
          </div>
          <div class="qcard-right">
            ${isUnlocked ? '<span class="qcard-arrow">›</span>' : ''}
          </div>
        `;
        if (isUnlocked) card.addEventListener('click', () => startQuiz(day));
        list.appendChild(card);
      });
    }

    function startQuiz(day) {
      if (!QUIZZES[day] || !QUIZZES[day].length) { alert('No quiz yet for this day!'); return; }
      currentDay = day; questions = [...QUIZZES[day]]; qIndex = 0; userAnswers = []; score = 0;

      document.getElementById('screenSelector').style.display = 'none';
      document.getElementById('screenResult').style.display = 'none';
      document.getElementById('screenQuiz').style.display = 'block';
      document.getElementById('topbarTitle').textContent = `Day ${day} Quiz`;
      document.getElementById('topbarRight').innerHTML = `<span class="topbar-badge">${LESSONS[day].icon}</span>`;
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[qIndex];
      const total = questions.length;

      document.getElementById('qcNum').textContent = `Q${qIndex + 1}`;
      document.getElementById('qcText').textContent = q.question;
      document.getElementById('qphCount').textContent = `${qIndex + 1} / ${total}`;
      document.getElementById('qphBar').style.width = `${(qIndex / total) * 100}%`;
      document.getElementById('qphLabel').textContent = `Day ${currentDay} – ${LESSONS[currentDay].title}`;
      document.getElementById('quizFeedback').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('nextBtn').textContent = qIndex === total - 1 ? 'See Results →' : 'Next Question →';

      const opts = document.getElementById('optionsList');
      opts.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="ob-letter">${'ABCD'[i]}</span><span class="ob-text">${opt}</span>`;
        btn.addEventListener('click', () => selectAnswer(i, btn));
        opts.appendChild(btn);
      });
    }

    function selectAnswer(index, btn) {
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      const q = questions[qIndex];
      const correct = index === q.correct;
      userAnswers.push({ question: q.question, chosen: index, correct: q.correct, isCorrect: correct });
      if (correct) { score++; btn.classList.add('ob-correct'); }
      else {
        btn.classList.add('ob-wrong');
        document.querySelectorAll('.option-btn')[q.correct].classList.add('ob-correct');
      }
      const fb = document.getElementById('quizFeedback');
      fb.style.display = 'block';
      fb.className = `quiz-feedback ${correct ? 'fb-correct' : 'fb-wrong'}`;
      fb.innerHTML = correct
        ? `✓ Correct! ${q.explanation || ''}`
        : `✗ Answer: <strong>${q.options[q.correct]}</strong>. ${q.explanation || ''}`;
      document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
      qIndex++;
      if (qIndex >= questions.length) showResult();
      else renderQuestion();
    }

    function showResult() {
      document.getElementById('screenQuiz').style.display = 'none';
      document.getElementById('screenResult').style.display = 'block';
      const total = questions.length;
      const pct = Math.round((score / total) * 100);
      let emoji, title, msg;
      if (pct === 100) { emoji = '🏆'; title = 'Perfect!'; msg = 'Outstanding — you nailed it!'; }
      else if (pct >= 67) { emoji = '🎉'; title = 'Great Job!'; msg = 'Well done! Check any mistakes below.'; }
      else if (pct >= 34) { emoji = '📚'; title = 'Keep Going!'; msg = 'Review the lesson and try again.'; }
      else { emoji = '💪'; title = "Don't Give Up!"; msg = 'Study the lesson carefully, then retry.'; }
      document.getElementById('rsEmoji').textContent = emoji;
      document.getElementById('rsTitle').textContent = title;
      document.getElementById('rsScore').textContent = `${score}/${total}`;
      document.getElementById('rsPct').textContent = `${pct}%`;
      document.getElementById('rsMsg').textContent = msg;
      document.getElementById('topbarTitle').textContent = 'Results';

      // Save best score
      const saved = JSON.parse(localStorage.getItem('quizScores') || '{}');
      if (!saved[currentDay] || score > saved[currentDay].score)
        saved[currentDay] = { score, total, pct, date: new Date().toDateString() };
      localStorage.setItem('quizScores', JSON.stringify(saved));

      // Review
      document.getElementById('rsReview').innerHTML =
        '<div class="rsr-label">Answer Review</div>' +
        userAnswers.map((a, i) => `
          <div class="rsr-item ${a.isCorrect ? 'rsr-ok' : 'rsr-no'}">
            <span>${a.isCorrect ? '✓' : '✗'}</span>
            <div>
              <div class="rsr-q">Q${i + 1}: ${a.question}</div>
              <div class="rsr-a">${questions[i].options[a.correct]}</div>
            </div>
          </div>`).join('');
    }

    function retryQuiz() { startQuiz(currentDay); }
    function backToSelector() {
      document.getElementById('screenResult').style.display = 'none';
      document.getElementById('screenSelector').style.display = 'block';
      document.getElementById('topbarTitle').textContent = 'Quiz';
      document.getElementById('topbarRight').innerHTML = '<span class="topbar-badge">Pick a day</span>';
      renderQuizCards('all');
    }
    function handleBack() {
      if (document.getElementById('screenSelector').style.display !== 'none') window.history.back();
      else backToSelector();
    }
  </script>
</body>
</html>
